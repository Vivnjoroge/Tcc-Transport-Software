<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TCC System - Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <main class="auth-container">
    <section class="auth-visual" aria-label="Transport illustration">
      <div class="auth-brand-mark">
        <img src="assets/tcc-logo.svg" alt="TCC logo" class="auth-logo" />
        <div>
          <p class="brand-kicker">TCC System</p>
          <h2>Manage your fleet with confidence</h2>
        </div>
      </div>
      <img
        src="assets/transport-illustration.svg"
        alt="Illustration of buses and logistics transport"
        class="auth-transport-img"
      />
      <p class="auth-visual-note">Track vehicles, staff, routes, and reports from one place.</p>
    </section>

    <section class="auth-card">
      <div class="auth-card-logo-row">
        <img src="assets/tcc-logo.svg" alt="TCC logo" class="auth-logo" />
        <span>TCC</span>
      </div>
      <h1>Login</h1>
      <p class="auth-subtitle">Transport Company Computerization (TCC) System</p>

      <!-- Status messages are shown here by JavaScript -->
      <div id="loginMessage" class="message" role="alert" aria-live="polite"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" name="loginEmail" placeholder="Enter email" />
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input
            type="password"
            id="loginPassword"
            name="loginPassword"
            placeholder="Enter password"
          />
        </div>

        <button type="submit" class="btn-primary">Login</button>
      </form>

      <p class="auth-note muted">
        Default Manager login: admin@tcc.com / admin123
      </p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
