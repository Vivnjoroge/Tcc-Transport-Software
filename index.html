<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TCC System - Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <main class="auth-container">
    <section class="auth-visual" aria-label="Transport illustration">
      <div class="auth-brand-mark">
        <div>
          <p class="brand-kicker">TCC Logistics</p>
          <h2>Streamline Your Fleet Management</h2>
        </div>
      </div>
      <img
        src="assets/transport-illustration.svg"
        alt="Illustration of buses and logistics transport"
        class="auth-transport-img"
      />
      <p class="auth-visual-note">Join thousands of operators managing arrivals, staff, and reports in real-time.</p>
    </section>

    <section class="auth-card">
      <div class="auth-card-logo-row">
        <span>TCC System</span>
      </div>
      <h1>Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your account</p>

      <div id="loginMessage" class="message" role="alert" aria-live="polite"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" name="loginEmail" placeholder="name@company.com" required />
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input
            type="password"
            id="loginPassword"
            name="loginPassword"
            placeholder="••••••••"
            required
          />
        </div>

        <button type="submit" class="btn-primary">Sign In</button>
      </form>

     <!--  <div class="auth-note muted">
        <p><strong>Manager Access:</strong> Use <strong>admin@tcc.com</strong> / <strong>admin123</strong> to explore administrative features.</p>
      </div>
 -->
      <p class="auth-note">
        Don't have an account? <a href="signup.html">Create an account</a>
      </p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
