<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TCC System - Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <main class="auth-container">
    <section class="auth-card">
      <h1>Login</h1>
      <p class="auth-subtitle">Transport Company Computerization (TCC) System</p>

      <!-- Status messages are shown here by JavaScript -->
      <div id="loginMessage" class="message" role="alert" aria-live="polite"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" name="loginEmail" placeholder="Enter email" />
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input
            type="password"
            id="loginPassword"
            name="loginPassword"
            placeholder="Enter password"
          />
        </div>

        <button type="submit" class="btn-primary">Login</button>
      </form>

      <p class="auth-note muted">
        <!-- Default Manager login: admin@tcc.com / admin123 -->
      </p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
