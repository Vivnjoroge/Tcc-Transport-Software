<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TCC System - Customer Signup</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <main class="auth-container">
    <section class="auth-visual" aria-label="Signup illustration">
      <div class="auth-brand-mark">
        <div>
          <p class="brand-kicker">Join TCC Logistics</p>
          <h2>Start Managing Your Operations</h2>
        </div>
      </div>
      <img
        src="assets/transport-illustration.svg"
        alt="Logistics network illustration"
        class="auth-transport-img"
      />
      <p class="auth-visual-note">Get started with a free customer account and track your shipments instantly.</p>
    </section>

    <section class="auth-card">
      <div class="auth-card-logo-row">
        <span>TCC Logistics</span>
      </div>
      <h1>Create Account</h1>
      <p class="auth-subtitle">Join our transportation network as a customer</p>

      <div id="signupMessage" class="message" role="alert" aria-live="polite"></div>

      <form id="signupForm" novalidate>
        <div class="form-group">
          <label for="signupFullName">Full Name</label>
          <input type="text" id="signupFullName" name="signupFullName" placeholder="e.g. John Doe" required />
        </div>

        <div class="form-group">
          <label for="signupEmail">Work Email</label>
          <input type="email" id="signupEmail" name="signupEmail" placeholder="name@example.com" required />
        </div>

        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input
            type="password"
            id="signupPassword"
            name="signupPassword"
            placeholder="Min. 6 characters"
            required
          />
        </div>

        <div class="form-group">
          <label for="signupConfirmPassword">Confirm Password</label>
          <input
            type="password"
            id="signupConfirmPassword"
            name="signupConfirmPassword"
            placeholder="Repeat password"
            required
          />
        </div>

        <button type="submit" class="btn-primary">Create Account</button>
      </form>

      <p class="auth-note">
        Already have an account? <a href="index.html">Sign in here</a>
      </p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
